name: Validate and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/test_server.py
      - run: python tests/test_gmgenie.py
      - run: python tests/test_commands.py
      - run: python tests/test_command_forms.py
      - run: python tests/test_ui.py
      - run: python tests/test_builder.py
      - run: python tests/test_players.py
      - run: python tests/test_catalog.py
      - run: python tools/package.py
      - run: python tests/test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: GMGenie-Forever
          path: |
            dist/GMGenie-*.zip
            dist/release.json
